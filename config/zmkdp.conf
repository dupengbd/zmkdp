# ============================================================
# ZMK 键盘固件配置文件
# ============================================================

# ============================================================
# 设备信息
# ============================================================
# 蓝牙设备名称
CONFIG_BT_DEVICE_NAME="Wang FeiXiang"

# ============================================================
# 编码器（旋钮）
# ============================================================
# 启用 EC11 旋转编码器
CONFIG_EC11=y
# 使用全局线程处理编码器事件
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# OLED 屏幕
# ============================================================
# 启用屏幕显示（开机即亮）
CONFIG_ZMK_DISPLAY=y
# 使用 ZMK 内置状态屏幕（显示层/电量/连接状态）
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# ============================================================
# ZMK Studio（在线配置工具）
# ============================================================
# 启用 ZMK Studio 支持
CONFIG_ZMK_STUDIO=y
# 禁用 UART 传输（有线方式）
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
# 启用 BLE 传输（无线方式，通过蓝牙连接 Studio）
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n
# 禁用 Studio 锁定功能（允许随时修改）
CONFIG_ZMK_STUDIO_LOCKING=n

# ============================================================
# 电池与电量显示
# ============================================================
# 启用电池检测功能
CONFIG_ZMK_BATTERY=y
# 屏幕显示电池状态小部件
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# 显示百分比电量（而非电压）
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# 启用蓝牙电池服务（BAS），向主机报告电量
CONFIG_BT_BAS=y
# 主控主动获取从机电池电量
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# 电量报告间隔 = 30 秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30

# ============================================================
# 外部电源
# ============================================================
# 启用外部电源检测（USB供电检测）
#CONFIG_ZMK_EXT_POWER=y

# ------------------------------------------------------------
# 5. RGB 底灯（WS2812 灯带）设置
# ------------------------------------------------------------
# 开启 RGB 底灯功能
CONFIG_ZMK_RGB_UNDERGLOW=y
# 启用 LED 灯带驱动（必须）
CONFIG_LED_STRIP=y
# 使用 WS2812 系列灯带驱动协议（必须）
CONFIG_WS2812_STRIP=y

# 启用外部电源控制（通常指通过 USB 检测或引脚控制 RGB 供电）
# 注：原代码为 y，意为启用该功能模块
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# 键盘启动时默认开启 RGB 灯效
# 注意：原注释为“不自动开启”，但配置值为 y (Yes)，此处已修正注释以匹配代码功能
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# RGB 灯光参数设置
# 初始色调 = 160 (青色/蓝绿色，HSV 色环范围 0-360)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# 初始灯光效果 = 3 (通常为波浪效果 "Spectrum" 或 "Swirl")
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# 最大亮度限制 = 90% (防止过亮，保护灯珠并节省电量)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
# RGB 动画速度初始值 (数值越大变化越快)
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=5
# ============================================================
# 蓝牙性能优化
# ============================================================
# 蓝牙发射功率 +8dB（增强信号，改善延迟和左右手通信）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ============================================================
# 鼠标功能
# ============================================================
# 启用鼠标/指针功能
CONFIG_ZMK_MOUSE=y

# ============================================================
# 按键防抖
# ============================================================
# 按下防抖 = 5ms（减少误触/连击）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# 松开防抖 = 5ms
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================
# 以下是被注释掉的备选/参考配置
# ============================================================

# 组合键（Combo）容量
# CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=15
# CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=15

# 睡眠与省电（目前被注释掉，因为存在屏幕唤醒问题）
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000


