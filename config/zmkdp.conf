# ============================================
# ZMK 键盘固件配置文件
# ============================================
# ============================================

# ------------------- 设备信息 -------------------
CONFIG_BT_DEVICE_NAME="zmk1"

# ------------------- 编码器配置 -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ------------------- 显示配置 -------------------
# 启用  OLED 显示屏
CONFIG_ZMK_DISPLAY=y

# 启用内置状态屏幕
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# ------------------- ZMK Studio 配置 -------------------
# 启用 ZMK Studio 功能
CONFIG_ZMK_STUDIO=y

# 传输方式配置
CONFIG_ZMK_STUDIO_TRANSPORT_UART=n   # 禁用 UART 传输
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y    # 启用蓝牙传输

# ------------------- 电池与电量显示 -------------------
# 启用电量检测
CONFIG_ZMK_BATTERY=y

# 电池状态部件
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y  # 显示百分比电量

# ------------------- RGB 灯效配置 -------------------
# 启用 RGB 底光功能
CONFIG_ZMK_RGB_UNDERGLOW=n

# 硬件配置
CONFIG_LED_STRIP=y              # 启用 LED 灯带
CONFIG_WS2812_STRIP=y           # 使用 WS2812 系列 RGB 灯带
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y  # 使用主控直接供电（无外部电源）

# 启动行为
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y  # 键盘启动时自动开启 RGB 灯效

# 默认参数设置
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160   # 初始色调：青色（HSV 色环 0-360°）
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3     # 初始灯效：波浪效果
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50      # 最大亮度限制：90%
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3     # 动画速度初始值

