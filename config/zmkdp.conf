# ============================================================
# ZMK 键盘固件配置文件
# ============================================================

# ============================================================
# 设备信息
# ============================================================
CONFIG_BT_DEVICE_NAME="zmk3"                # 蓝牙设备名称

# ============================================================
# 编码器（旋钮）
# ============================================================
CONFIG_EC11=y                               # 启用 EC11 旋转编码器
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y         # 使用全局线程处理编码器事件

# ============================================================
# OLED 屏幕
# ============================================================
CONFIG_ZMK_DISPLAY=y                        # 启用屏幕显示
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y # 使用 ZMK 内置状态屏幕（显示层/电量/连接状态）

# ============================================================
# ZMK Studio（在线配置工具）
# ============================================================
CONFIG_ZMK_STUDIO=y                         # 启用 ZMK Studio 支持
CONFIG_ZMK_STUDIO_TRANSPORT_UART=n          # 禁用 UART 传输（有线方式）
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y           # 启用 BLE 传输（无线方式，通过蓝牙连接 Studio）
CONFIG_ZMK_STUDIO_LOCKING=n                 # 禁用 Studio 锁定功能（允许随时修改）

# ============================================================
# 电池与电量显示
# ============================================================
CONFIG_ZMK_BATTERY=y                        # 启用电池检测功能
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y          # 屏幕显示电池状态小部件
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y  # 显示百分比电量（而非电压）
CONFIG_BT_BAS=y                             # 启用蓝牙电池服务（BAS），向主机报告电量
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y  # 主控主动获取从机电池电量
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30       # 电量报告间隔 = 30 秒

# ============================================================
# 外部电源
# ============================================================
CONFIG_ZMK_EXT_POWER=y                      # 启用外部电源检测（USB供电检测）

# ============================================================
# RGB 底灯
# ============================================================
CONFIG_ZMK_RGB_UNDERGLOW=y                  # 启用 RGB 底灯功能
CONFIG_WS2812_STRIP=y                       # 启用 WS2812 灯带驱动
CONFIG_LED_STRIP=y                          # 启用 LED 灯带（与 WS2812 配合）
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y        # 使用外部独立供电（USB供电时亮灯）
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n         # 开机默认关灯
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y    # 空闲时自动关闭 RGB（省电）
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160      # 初始色相 = 160（青色/蓝绿色，范围 0~359）
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3        # 初始灯效 = 3（波浪效果，0~9 可选）
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90         # 最大亮度限制 = 50%（保护灯珠/省电）
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3        # 动画速度初始值 = 5（0~9，数值越大变化越快）
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n   # （备选）USB 断开时自动关灯（已注释，保留手动控制）

# ============================================================
# 蓝牙性能优化
# ============================================================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y              # 蓝牙发射功率 +8dB（增强信号，改善延迟和左右手通信）
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=n            # （备选）不启用蓝牙配对密码

# ============================================================
# 鼠标功能
# ============================================================
CONFIG_ZMK_MOUSE=y                          # 启用鼠标/指针功能

# ============================================================
# 按键防抖
# ============================================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5        # 按下防抖 = 5ms（减少误触/连击）
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5      # 松开防抖 = 5ms

# ============================================================
# 以下是被注释掉的备选/参考配置
# ============================================================

# --- 组合键（Combo）容量 ---
